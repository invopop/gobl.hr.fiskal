# A pizzeria receipt after a real receipt of 2022 (in kuna; the amounts are
# kept as euros). Soft drinks and mineral water pay PP too; natural water
# and 100 % juices without added sugar do not.
# The prices are the menu prices, which include VAT and, on drinks, the
# consumption tax (PP): both taxes share one base, the price without VAT.
# prices_include names VAT, and each drink's PP says that its price
# includes PP too (hr-fiskal-pp: included-in-price). The addon takes PP out of
# those prices, so the total is the sum of the menu prices.
$schema: "https://gobl.org/draft-0/bill/invoice"
$regime: "HR"
$addons: ["hr-fiskal-b2c-v1"]
uuid: "019a9b10-3a41-7c2e-8f5d-6b7c8d9e0a13"
type: standard
code: "5450"
issue_date: "2026-11-06"
issue_time: "21:36:04"
currency: "EUR"
tax:
  prices_include: VAT
  ext:
    hr-fiskal-premises: "POS1"
    hr-fiskal-device: "1"

supplier:
  name: "Invopop d.o.o."
  tax_id:
    country: "HR"
    code: "80432461483"
  people:
    - key: operator
      name:
        given: "Ivan"
        surname: "Horvat"
      identities:
        - type: OIB
          code: "80432461483"

lines:
  # Draught beer
  - quantity: 1
    item:
      name: "Točeno pivo 0,30 l"
      price: "17.00"
    taxes:
      - cat: VAT
        rate: general
      - cat: PP
        percent: "3%"
        ext:
          hr-fiskal-pp: included-in-price

  # Draught beer
  - quantity: 2
    item:
      name: "Točeno pivo 0,50 l"
      price: "20.00"
    taxes:
      - cat: VAT
        rate: general
      - cat: PP
        percent: "3%"
        ext:
          hr-fiskal-pp: included-in-price

  # Cedevita, a vitamin soft drink
  - quantity: 1
    item:
      name: "Cedevita"
      price: "15.00"
    taxes:
      - cat: VAT
        rate: general
      - cat: PP
        percent: "3%"
        ext:
          hr-fiskal-pp: included-in-price

  # Mineral water
  - quantity: 1
    item:
      name: "Mineralna voda 0,25 l"
      price: "13.00"
    taxes:
      - cat: VAT
        rate: general
      - cat: PP
        percent: "3%"
        ext:
          hr-fiskal-pp: included-in-price

  # Mixed pizza, large
  - quantity: 1
    item:
      name: "Pizza miješana, velika"
      price: "57.00"
    taxes:
      - cat: VAT
        rate: reduced

  # Seafood pizza, large
  - quantity: 1
    item:
      name: "Pizza mare, velika"
      price: "60.00"
    taxes:
      - cat: VAT
        rate: reduced

  # House pizza, large
  - quantity: 1
    item:
      name: "Pizza kuće, velika"
      price: "60.00"
    taxes:
      - cat: VAT
        rate: reduced

payment:
  advances:
    - key: cash
      description: "Gotovina"
      percent: "100%"
