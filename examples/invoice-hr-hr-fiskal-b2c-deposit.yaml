supplier:
  name: "Invopop d.o.o."
  tax_id:
    country: "HR"
    code: "80432461483"
  ext:
    hr-fiskal-vat-status: "registered"
  people:
    - key: operator
      name:
        given: "Ivan"
        surname: "Horvat"
