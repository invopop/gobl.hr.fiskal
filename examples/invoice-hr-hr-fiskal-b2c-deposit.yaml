# A shop receipt with drinks and the deposit on their packaging (povratna
# naknada, 0.10 EUR per bottle or can since 2025). The deposit is not a tax
# and has no VAT: it is a charge without taxes, which CIS receives as a fee
# (Naknada), by its name and amount.
