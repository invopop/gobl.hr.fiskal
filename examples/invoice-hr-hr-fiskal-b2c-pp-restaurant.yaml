# A restaurant receipt with drinks, food and a cover charge, after a real
# receipt of 2025. On that receipt, the till also charged PP on the cover
# charge; the law taxes only drinks, so here it pays VAT only.
# Drinks pay VAT and the consumption tax (PP); food pays VAT only. The menu
# price of a drink includes both taxes, which share one base, the price
# without VAT. GOBL can take only one tax out of a price, so each price here
# leaves out both: the menu price / 1.28 (25 % VAT + 3 % PP), or / 1.13 for
# food at 13 % VAT.
$schema: "https://gobl.org/draft-0/bill/invoice"
$regime: "HR"
$addons: ["hr-fiskal-b2c-v1"]
uuid: "019a9b10-3a41-7c2e-8f5d-6b7c8d9e0a12"
type: standard
code: "1878"
