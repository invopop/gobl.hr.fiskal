# A bar receipt with one drink and the consumption tax, after a real
# receipt of 2025: 2 x 4.00, of which VAT 1.56 and PP 0.19 on a base of 6.25.
# The prices are the menu prices, which include VAT and, on drinks, the
# consumption tax (PP): both taxes share one base, the price without VAT.
# prices_include names VAT, and each drink's PP says that its price
# includes PP too (hr-fiskal-pp-price: included). The addon takes PP out of
# those prices, so the total is the sum of the menu prices.
$schema: "https://gobl.org/draft-0/bill/invoice"
$regime: "HR"
$addons: ["hr-fiskal-b2c-v1"]
uuid: "019a9b10-3a41-7c2e-8f5d-6b7c8d9e0a11"
type: standard
code: "1455"
issue_date: "2026-11-06"
issue_time: "16:07:00"
currency: "EUR"
tax:
  prices_include: VAT
  ext:
    hr-fiskal-premises: "POS1"
    hr-fiskal-device: "1"

supplier:
  name: "Invopop d.o.o."
  tax_id:
    country: "HR"
    code: "80432461483"
  people:
    - key: operator
      name:
        given: "Ivan"
        surname: "Horvat"
      identities:
        - type: OIB
          code: "80432461483"

lines:
  # Pelinkovac, a herbal liqueur
  - quantity: 2
    item:
      name: "Pelinkovac 0,03 l"
      price: "4.00"
    taxes:
      - cat: VAT
        rate: general
      - cat: PP
        percent: "3%"
        ext:
          hr-fiskal-pp-price: included

payment:
  advances:
    - key: cash
      description: "Gotovina"
      percent: "100%"
